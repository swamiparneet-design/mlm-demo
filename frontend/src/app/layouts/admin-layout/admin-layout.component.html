<div class="min-h-screen bg-slate-50">
  <aside class="hidden lg:flex lg:flex-col lg:fixed lg:inset-y-0 lg:left-0 lg:w-64 bg-navy-900 text-white z-30">
    <div class="flex items-center gap-2.5 h-16 px-6 border-b border-white/10">
      <div class="w-8 h-8 rounded-lg bg-gold-500 flex items-center justify-center font-bold text-sm text-navy-900">A</div>
      <div class="leading-tight">
        <div class="font-semibold text-base tracking-tight">Ascendia</div>
        <div class="text-[11px] text-navy-300 -mt-0.5">Admin Console</div>
      </div>
    </div>
    <nav class="flex-1 px-3 py-5 space-y-1 overflow-y-auto">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-navy-200 hover:bg-white/5 hover:text-white transition-smooth"
        >
          <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" [innerHTML]="item.icon"></svg>
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="p-4 border-t border-white/10">
      <button
        type="button"
        (click)="logout()"
        class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-sm font-medium text-navy-200 hover:bg-white/5 hover:text-white transition-smooth"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
        </svg>
        Log out
      </button>
    </div>
  </aside>

  @if (mobileMenuOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden">
      <div class="absolute inset-0 bg-navy-950/60" (click)="mobileMenuOpen.set(false)"></div>
      <aside class="absolute inset-y-0 left-0 w-72 bg-navy-900 text-white flex flex-col animate-[modalIn_0.18s_ease-out]">
        <div class="flex items-center justify-between h-16 px-5 border-b border-white/10">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-gold-500 flex items-center justify-center font-bold text-sm text-navy-900">A</div>
            <span class="font-semibold text-lg">Admin Console</span>
          </div>
          <button type="button" (click)="mobileMenuOpen.set(false)" class="text-navy-300 hover:text-white">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <nav class="flex-1 px-3 py-5 space-y-1 overflow-y-auto">
          @for (item of navItems; track item.route) {
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-white/10 text-white"
              (click)="mobileMenuOpen.set(false)"
              class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-navy-200 hover:bg-white/5 hover:text-white transition-smooth"
            >
              <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" [innerHTML]="item.icon"></svg>
              {{ item.label }}
            </a>
          }
        </nav>
        <div class="p-4 border-t border-white/10">
          <button
            type="button"
            (click)="logout()"
            class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-sm font-medium text-navy-200 hover:bg-white/5 hover:text-white transition-smooth"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
            </svg>
            Log out
          </button>
        </div>
      </aside>
    </div>
  }

  <div class="lg:pl-64 flex flex-col min-h-screen">
    <header class="sticky top-0 z-20 h-16 bg-white border-b border-slate-200 flex items-center gap-3 px-4 sm:px-6">
      <button type="button" class="lg:hidden text-slate-500 hover:text-slate-700 -ml-1" (click)="mobileMenuOpen.set(true)">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
        </svg>
      </button>

      <div class="flex-1"></div>

      <app-badge variant="gold" size="sm">{{ auth.role() }}</app-badge>

      <div class="flex items-center gap-2.5 pl-3 border-l border-slate-200">
        <div class="w-8 h-8 rounded-full bg-navy-100 text-navy-700 flex items-center justify-center text-xs font-semibold">
          {{ initials() }}
        </div>
        <span class="hidden sm:block text-sm font-medium text-slate-700">{{ auth.currentUser()?.fullName }}</span>
        <button type="button" (click)="logout()" class="hidden sm:block text-slate-400 hover:text-red-500 transition-smooth" aria-label="Log out">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
          </svg>
        </button>
      </div>
    </header>

    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-[1600px] w-full mx-auto">
      <router-outlet></router-outlet>
    </main>
  </div>

  <app-toast-container></app-toast-container>
</div>
